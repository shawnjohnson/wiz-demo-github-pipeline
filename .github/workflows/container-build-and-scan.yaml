name: Build and Scan Container Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: "Wiz-cli Image Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for GitHub Package Repository
      security-events: write # Required for SARIF upload
      
      # only required for workflows in private repositories
      actions: read
    env:
      SCAN_PATH: "."
      TAG: "latest"
      POLICY: "shawnjohnson-build-audit-only"
      REGISTRY: ghcr.io # REGISTRY can stay here as it's a fixed value

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Derived Variables # New step to calculate and expose variables
      id: set-vars # Give this step an ID to reference its outputs
      run: |
        # Calculate the full image name and tag
        # Note: env.REGISTRY, github.repository, and env.TAG are fully resolved here
        FULL_IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository }}:${{ env.TAG }}"
        echo "Calculated Full Image Tag: $FULL_IMAGE_TAG"
        
        # Export this as an output for subsequent steps
        # The format is 'echo "::set-output name=<output_name>::<value>"' for older runners
        # For newer runners (like ubuntu-latest), use GITHUB_OUTPUT file
        echo "full_image_tag=$FULL_IMAGE_TAG" >> "$GITHUB_OUTPUT" 

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Container Image (and load locally for scan)
      id: build-image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Containerfile
        push: false
        load: true
        # Use the output from the 'set-vars' step
        tags: "${{ steps.set-vars.outputs.full_image_tag }}"

    - name: Download Wiz CLI
      run: curl -o wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli

    - name: Authenticate to Wiz
      run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
      env:
        WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
        WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

    - name: Docker Info (confirm local image presence)
      run: |
        echo "Confirming image presence locally:"
        # Use the calculated tag for grep for consistency
        docker image list # | grep "${{ steps.set-vars.outputs.full_image_tag }}"
        docker images --digests # | grep "${{ steps.set-vars.outputs.full_image_tag }}"

    - name: Run wiz-cli docker image scan (on locally built image)
      id: wiz-scan
      run: |
        sudo ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
        # Use the calculated tag
        sudo ./wizcli docker scan --image "${{ steps.set-vars.outputs.full_image_tag }}" \
         --output wiz-vuln-scan.sarif,sarif \
         --policy "$POLICY" \
         --driver mountWithLayers
        
      env:
        WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
        WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

    - name: Upload SARIF results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: wiz-vuln-scan.sarif

    - name: Push Container Image (only after successful scan)
      # Use the calculated tag
      run: docker push "${{ steps.set-vars.outputs.full_image_tag }}"

    - name: Fetch digest of Docker image for Graph enrichment
      run: |
        echo "Listing local docker images after push:"
        docker image list
        echo "Listing local docker images with digests after push:"
        docker images --digests
        # Use the calculated tag
        # Sudo required to access the image mapping tmp file from wizcli docker scan mountWithLayers
        sudo ./wizcli docker tag --image "${{ steps.set-vars.outputs.full_image_tag }}"
